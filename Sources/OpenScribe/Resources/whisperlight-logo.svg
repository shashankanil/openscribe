<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">OpenScribe voice waveform</title>
  <desc id="desc">A centred warm-white voice waveform on a deep graphite tile, on the macOS icon grid.</desc>
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#23262F"/><stop offset="1" stop-color="#121419"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".10"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter>
  </defs>
  <rect x="50" y="50" width="412" height="412" rx="92" fill="url(#ink)" filter="url(#shadow)"/>
  <rect x="50" y="50" width="412" height="412" rx="92" fill="url(#sheen)"/>
  <path d="M163 256 C178 181 194 181 209 256 C224 331 240 331 256 256 C271 181 287 181 302 256 C317 331 333 331 349 256" fill="none" stroke="#FFFBEA" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
