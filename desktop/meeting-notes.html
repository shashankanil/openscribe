<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meeting Notes</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          background-color: rgb(17 18 17);
          color: rgb(245 242 232);
        }
      }
      :root[data-theme="light"] {
        color-scheme: light;
        background-color: var(--os-background, rgb(249 247 243));
        color: var(--os-ink, rgb(31 36 28));
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        background-color: var(--os-background, rgb(17 18 17));
        color: var(--os-ink, rgb(245 242 232));
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: var(--os-background, rgb(249 247 243));
        color: var(--os-ink, rgb(31 36 28));
        overflow: hidden;
        user-select: text;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      * {
        box-sizing: border-box;
        scrollbar-width: thin;
        scrollbar-color: var(--os-notes-scrollbar, rgba(128, 128, 128, 0.35)) transparent;
      }
      *::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      *::-webkit-scrollbar-track {
        background: transparent;
      }
      *::-webkit-scrollbar-thumb {
        background-color: var(--os-notes-scrollbar, rgba(128, 128, 128, 0.35));
        border-radius: 999px;
      }
      *::-webkit-scrollbar-thumb:hover {
        background-color: var(--os-notes-scrollbar-hover, rgba(128, 128, 128, 0.55));
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/meetingNotes/main.tsx"></script>
  </body>
</html>
